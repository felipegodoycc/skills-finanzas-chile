name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pdfplumber reportlab pypdf
      - name: Pruebas de cada skill
        run: |
          for t in skills/*/scripts/test_*.py; do python3 -I "$t" || exit 1; done
