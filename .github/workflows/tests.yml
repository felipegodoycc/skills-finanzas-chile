name: tests
on: [push, pull_request]
jobs:
  validar-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Versión fija: el directorio de Claude exige instaladores con versión exacta
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validar manifiestos y frontmatter de las skills
        run: claude plugin validate . --strict
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pdfplumber reportlab pypdf
      - name: Pruebas de cada skill
        run: |
          for t in skills/*/scripts/test_*.py; do python3 -I "$t" || exit 1; done
